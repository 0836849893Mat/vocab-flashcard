<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>✨ สนุกเรียนคำศัพท์จีน ✨</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap');

  :root {
    --card-bg: rgba(255, 255, 255, 0.92);
    --ink: #334155;
    --primary: #ec4899;
    --primary-hover: #db2777;
    --secondary: #6366f1;
    --shadow: 0 20px 40px -15px rgba(236, 72, 153, 0.2), 0 10px 20px -10px rgba(99, 102, 241, 0.15);
  }

  body {
    font-family: 'Prompt', sans-serif, -apple-system;
    background: linear-gradient(135deg, #fbcfe8 0%, #c7d2fe 50%, #fed7aa 100%);
    background-size: 400% 400%;
    animation: gradientBG 15s ease infinite;
    color: var(--ink);
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 15px;
    overflow-x: hidden;
    position: relative;
  }

  @keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .floating-shapes {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    overflow: hidden;
    z-index: -1;
    pointer-events: none;
  }

  .shape {
    position: absolute;
    border-radius: 50%;
    filter: blur(40px);
    opacity: 0.6;
    animation: float 8s ease-in-out infinite alternate;
  }

  .shape:nth-child(1) { width: 250px; height: 250px; background: #ff758c; top: 10%; left: 10%; }
  .shape:nth-child(2) { width: 300px; height: 300px; background: #7f7fd5; bottom: 10%; right: 10%; animation-delay: -3s; }
  .shape:nth-child(3) { width: 200px; height: 200px; background: #ffe259; top: 60%; left: 20%; animation-delay: -5s; }

  @keyframes float {
    0% { transform: translateY(0px) scale(1); }
    100% { transform: translateY(-25px) scale(1.08); }
  }

  .container {
    width: 100%;
    max-width: 420px;
    text-align: center;
    z-index: 1;
  }

  header { margin-bottom: 20px; }

  h1 {
    font-size: 1.6rem;
    color: #1e293b;
    margin: 0 0 5px 0;
    font-weight: 700;
    text-shadow: 0 2px 10px rgba(255,255,255,0.6);
  }

  .stats {
    font-size: 0.9rem;
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(8px);
    padding: 6px 16px;
    border-radius: 20px;
    display: inline-block;
    color: #475569;
    font-weight: 600;
    box-shadow: 0 4px 15px rgba(0,0,0,0.05);
  }

  .card {
    background: var(--card-bg);
    backdrop-filter: blur(12px);
    border: 3px solid rgba(255, 255, 255, 0.8);
    border-radius: 28px;
    padding: 35px 20px;
    box-shadow: var(--shadow);
    cursor: pointer;
    min-height: 240px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    position: relative;
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    margin-bottom: 20px;
  }

  .card:hover { transform: translateY(-5px); }
  .card:active { transform: scale(0.98); }

  .hanzi {
    font-size: 4.5rem;
    margin-bottom: 5px;
    font-weight: 700;
    color: #0f172a;
    letter-spacing: 2px;
  }

  .pinyin {
    font-size: 1.2rem;
    color: var(--secondary);
    margin-bottom: 15px;
    font-weight: 600;
    display: none;
  }

  .translation-box {
    display: none;
    margin-top: 5px;
    border-top: 2px dashed #cbd5e1;
    padding-top: 15px;
    text-align: center;
  }

  .lang-thai {
    font-size: 1.15rem;
    color: #db2777;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .lang-eng {
    font-size: 0.95rem;
    color: #64748b;
  }

  .card.revealed .pinyin, 
  .card.revealed .translation-box {
    display: block;
    animation: fadeIn 0.3s ease-in-out;
  }

  .card.revealed .hint-tap { display: none; }

  .hint-tap {
    font-size: 0.8rem;
    color: #94a3b8;
    position: absolute;
    bottom: 15px;
    width: 100%;
    left: 0;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(5px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .audio-btn {
    position: absolute;
    top: 15px;
    right: 15px;
    background: #fdf2f8;
    border: 2px solid #fbcfe8;
    border-radius: 50%;
    width: 42px;
    height: 42px;
    font-size: 1.2rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    z-index: 2;
  }
  .audio-btn:hover { background: #fce7f3; transform: scale(1.1); }

  .nav-controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 15px;
  }

  .btn {
    background: rgba(255, 255, 255, 0.9);
    backdrop-filter: blur(10px);
    border: 2px solid rgba(255, 255, 255, 0.8);
    padding: 14px;
    border-radius: 18px;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    transition: all 0.2s;
    font-family: 'Prompt', sans-serif;
    color: #475569;
  }
  .btn:hover { background: #ffffff; transform: translateY(-2px); }
  .btn-primary {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
    box-shadow: 0 4px 20px rgba(236, 72, 153, 0.35);
  }
  .btn-primary:hover { background: var(--primary-hover); }

  .panel {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(12px);
    border-radius: 18px;
    padding: 15px;
    font-size: 0.85rem;
    color: #64748b;
    box-shadow: 0 8px 25px rgba(0,0,0,0.05);
    border: 2px solid rgba(255, 255, 255, 0.6);
  }
  input[type="file"] { display: none; }
  .upload-label {
    display: block;
    text-align: center;
    background: #e0e7ff;
    color: #4338ca;
    padding: 10px;
    border-radius: 12px;
    cursor: pointer;
    font-weight: 600;
    margin-top: 8px;
    transition: all 0.2s;
  }
  .upload-label:hover { background: #c7d2fe; transform: scale(1.01); }
</style>
</head>
<body>

  <div class="floating-shapes">
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>
  </div>

<div class="container">
  <header>
    <h1>🌸 คลังคำศัพท์จีน 🌸</h1>
    <div class="stats" id="stats">คำที่ 1 / 10 (สุ่ม)</div>
  </header>

  <!-- Flashcard -->
  <div class="card" id="flashcard" onclick="toggleCard()">
    <button class="audio-btn" onclick="playAudioExplicit(event)" title="ฟังเสียง">🔊</button>
    <div class="hanzi" id="cardHanzi">你好</div>
    <div class="pinyin" id="cardPinyin">nǐ hǎo</div>
    
    <div class="translation-box" id="translationBox">
      <div class="lang-thai" id="cardThai">สวัสดี</div>
      <div class="lang-eng" id="cardEnglish">hello</div>
    </div>
    
    <div class="hint-tap">👆 แตะการ์ดเพื่อดูคำแปล</div>
  </div>

  <!-- Navigation Buttons -->
  <div class="nav-controls">
    <button class="btn" onclick="prevCard()">⬅️ คำก่อนหน้า</button>
    <button class="btn btn-primary" onclick="nextCard()">คำถัดไป ➡️</button>
  </div>

  <!-- Upload Panel -->
  <div class="panel">
    <span>เปลี่ยนชุดคำศัพท์ (รองรับไฟล์ JSON):</span>
    <label class="upload-label">
      📁 เลือกไฟล์คำศัพท์
      <input type="file" id="fileInput" accept=".json" onchange="loadCustomFile(event)">
    </label>
  </div>
</div>

<script>
let vocabList = [
  { h: "你好", p: "nǐ hǎo", t: "สวัสดี", e: "hello" },
  { h: "谢谢", p: "xièxie", t: "ขอบคุณ", e: "thank you" },
  { h: "再见", p: "zàijiàn", t: "ลาก่อน", e: "goodbye" },
  { h: "中国", p: "zhōngguó", t: "ประเทศจีน", e: "China" },
  { h: "学生", p: "xuésheng", t: "นักเรียน", e: "student" },
  { h: "老师", p: "lǎoshī", t: "คุณครู", e: "teacher" },
  { h: "学习", p: "xuéxí", t: "เรียน / ศึกษา", e: "to study / learn" },
  { h: "汉字", p: "hànzì", t: "ตัวอักษรจีน", e: "Chinese character" },
  { h: "手机", p: "shǒujī", t: "โทรศัพท์มือถือ", e: "mobile phone" },
  { h: "电脑", p: "diànnǎo", t: "คอมพิวเตอร์", e: "computer" }
];

let shuffledIndices = [];
let currentPointer = 0;
let isRevealed = false;

if (localStorage.getItem("zh_cute_deck")) {
  try {
    const saved = JSON.parse(localStorage.getItem("zh_cute_deck"));
    if (saved.length > 0) vocabList = saved;
  } catch(e) {}
}

function initShuffledDeck() {
  shuffledIndices = vocabList.map((_, i) => i);
  for (let i = shuffledIndices.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffledIndices[i], shuffledIndices[j]] = [shuffledIndices[j], shuffledIndices[i]];
  }
  currentPointer = 0;
}

initShuffledDeck();

function updateUI() {
  document.getElementById("stats").textContent = `คำที่ ${currentPointer + 1} / ${vocabList.length} (สุ่ม)`;
  const actualIndex = shuffledIndices[currentPointer];
  const word = vocabList[actualIndex];
  
  isRevealed = false;
  document.getElementById("flashcard").classList.remove("revealed");
  
  document.getElementById("cardHanzi").textContent = word.h;
  document.getElementById("cardPinyin").textContent = word.p || "";
  document.getElementById("cardThai").textContent = word.t || "-";
  document.getElementById("cardEnglish").textContent = word.e || "-";
}

function toggleCard() {
  isRevealed = !isRevealed;
  const card = document.getElementById("flashcard");
  if (isRevealed) {
    card.classList.add("revealed");
    playAudio();
  } else {
    card.classList.remove("revealed");
  }
}

function nextCard() {
  currentPointer++;
  if (currentPointer >= vocabList.length) {
    initShuffledDeck();
  }
  updateUI();
}

function prevCard() {
  currentPointer--;
  if (currentPointer < 0) {
    currentPointer = vocabList.length - 1;
  }
  updateUI();
}

// แยกปุ่มกดลำโพงออกมาให้ออกเสียงทันทีโดยไม่ต้องพลิกการ์ดซ้ำ
function playAudioExplicit(event) {
  event.stopPropagation();
  playAudio();
}

function playAudio() {
  if (!('speechSynthesis' in window)) return;

  const actualIndex = shuffledIndices[currentPointer];
  const word = vocabList[actualIndex];
  if (!word || !word.h) return;

  window.speechSynthesis.cancel();
  
  const utterance = new SpeechSynthesisUtterance(word.h);
  utterance.lang = 'zh-CN';
  utterance.rate = 0.82; 
  utterance.pitch = 1.05; 

  const voices = window.speechSynthesis.getVoices();
  const chineseVoices = voices.filter(v => 
    v.lang.toLowerCase().includes('zh') || 
    v.lang.toLowerCase().includes('cmn') || 
    v.lang.toLowerCase().includes('chinese')
  );
  
  if (chineseVoices.length > 0) {
    const matchedVoice = chineseVoices.find(v => 
      v.name.includes('Ting-Ting') || 
      v.name.includes('Tingting') || 
      v.name.includes('Xiaoxiao') || 
      v.name.includes('Yaoyao') ||
      v.name.includes('Hui') ||
      v.name.includes('Female')
    ) || chineseVoices[0];
    
    utterance.voice = matchedVoice;
  }

  window.speechSynthesis.speak(utterance);
}

if ('speechSynthesis' in window) {
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}

function loadCustomFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const json = JSON.parse(e.target.result);
      const rawArray = Array.isArray(json) ? json : (json.words || json.data || []);
      const parsedData = rawArray.map(item => ({
        h: item.h || item.hanzi || item.word || "",
        p: item.p || item.pinyin || "",
        t: item.t || item.thai || item.meaning_th || "",
        e: item.e || item.english || item.definition || ""
      })).filter(x => x.h);

      if (parsedData.length > 0) {
        vocabList = parsedData;
        initShuffledDeck();
        localStorage.setItem("zh_cute_deck", JSON.stringify(vocabList));
        updateUI();
        alert("🎉 โหลดคำศัพท์สำเร็จ " + vocabList.length + " คำ (สุ่มไม่ซ้ำกัน)");
      } else {
        alert("❌ ไม่พบข้อมูลคำศัพท์ที่ถูกต้องในไฟล์ JSON");
      }
    } catch(err) {
      alert("❌ เกิดข้อผิดพลาดในการอ่านไฟล์: " + err.message);
    }
  };
  reader.readAsText(file, "utf-8");
}

updateUI();
</script>

</body>
</html>
